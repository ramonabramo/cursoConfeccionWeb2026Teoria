<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>La Máquina del Tiempo</title>
    <link rel="stylesheet" href="main.css">
</head>

<body>
    <div class="contenedor">
        <h1>⏳ La Máquina del Tiempo</h1>
        <p>Introduce el año de inicio y de fin para tu viaje temporal.</p>

        <div class="controles">
            <label for="inputInicio">Año de partida:</label>
            <input type="number" id="inputInicio" placeholder="Ej: 1980">

            <label for="inputFin">Año de destino:</label>
            <input type="number" id="inputFin" placeholder="Ej: 1985">

            <button id="btnViajar">¡Activar Condensador de Fluzo!</button>
        </div>

        <div id="pantallaViaje" class="salida">Esperando coordenadas temporales...</div>

        <!-- Firma de autoría -->
        <div class="firma">Alpe Formación - Realizado por Ramón Abramo</div>
    </div>
    <script src="app.js"></script>
</body>

</html>
