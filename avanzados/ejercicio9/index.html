<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>La Megaburger</title>
    <link rel="stylesheet" href="main.css">
</head>

<body>
    <div class="contenedor">
        <h1>🍔 La Megaburger</h1>
        <p>Añade ingredientes a tu hamburguesa y mide cuántos pisos tiene.</p>

        <div class="controles">
            <input type="text" id="inputIngrediente" placeholder="Ej: 🥓 Bacon">

            <div class="botones">
                <button id="btnAnadir" class="btn-rojo">Añadir Ingrediente</button>
                <button id="btnMedir" class="btn-amarillo">¿Cuántos pisos tiene?</button>
            </div>
        </div>

        <div id="pantallaCocina" class="salida">Pan de abajo listo...</div>

        <!-- Firma de autoría -->
        <div class="firma">Alpe Formación - Realizado por Ramón Abramo</div>
    </div>
    <script src="app.js"></script>
</body>

</html>
