<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 220" width="100%" height="100%">
  <defs>
    <linearGradient id="mouseBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="shadow7" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.22)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>
  <ellipse cx="130" cy="188" rx="60" ry="12" fill="url(#shadow7)"/>
  <!-- Mouse outline -->
  <path d="M130 35 C165 35, 185 85, 185 135 C185 175, 160 185, 130 185 C100 185, 75 175, 75 135 C75 85, 95 35, 130 35 Z" fill="url(#mouseBody)" stroke="#475569" stroke-width="2"/>
  <!-- Center split line -->
  <line x1="130" y1="35" x2="130" y2="95" stroke="#475569" stroke-width="1.5"/>
  <!-- Scroll wheel -->
  <rect x="126" y="50" width="8" height="24" rx="4" fill="#06b6d4" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Ergonomic side thumb grip -->
  <path d="M78 95 Q68 125 78 150" stroke="#0ea5e9" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- DPI button -->
  <rect x="127" y="82" width="6" height="8" rx="2" fill="#64748b"/>
</svg>