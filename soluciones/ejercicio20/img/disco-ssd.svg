<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 220" width="100%" height="100%">
  <defs>
    <linearGradient id="ssdMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="shadow9" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.22)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>
  <ellipse cx="130" cy="180" rx="85" ry="14" fill="url(#shadow9)"/>
  <!-- Aluminum body with curved sides -->
  <rect x="40" y="70" width="180" height="95" rx="18" fill="url(#ssdMetal)" stroke="#60a5fa" stroke-width="1.5"/>
  <path d="M40 85 C45 80, 45 150, 40 150" stroke="#1d4ed8" stroke-width="3" fill="none"/>
  <path d="M220 85 C215 80, 215 150, 220 150" stroke="#1d4ed8" stroke-width="3" fill="none"/>
  <!-- USB-C Port -->
  <rect x="35" y="112" width="7" height="12" rx="3" fill="#0f172a"/>
  <!-- Status LED -->
  <circle cx="58" cy="118" r="3" fill="#38bdf8"/>
  <!-- Brand text -->
  <text x="135" y="115" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" letter-spacing="2" text-anchor="middle">PORTABLE SSD</text>
  <text x="135" y="132" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#93c5fd" letter-spacing="1" text-anchor="middle">1TB NVMe 3.2</text>
</svg>