<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>El Tren de los Monstruos</title>
    <link rel="stylesheet" href="main.css">
</head>

<body>
    <div class="contenedor">
        <h1>🚂 El Tren de la Longitud</h1>
        <p>Monstruos en el andén listos para subir.</p>

        <div class="controles">
            <input type="text" id="inputMonstruo" placeholder="Ej: 🧟 Zombi">
            <button id="btnSubir">Subir al Tren</button>
            <button id="btnContar">¿Cuántos vagones hay ocupados?</button>
        </div>

        <div id="resultado" class="salida">El tren está esperando en la estación...</div>
    </div>
    <script src="app.js"></script>
</body>

</html>
