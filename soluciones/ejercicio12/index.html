<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>El Supermercado Loco (Solución)</title>
    <link rel="stylesheet" href="main.css">
</head>

<body>
    <div class="contenedor">
        <h1>🛒 Supermercado Loco (Solución)</h1>
        <p>Haz clic en los productos de las estanterías para meterlos en tu carrito.</p>

        <!-- Estantería de productos -->
        <div class="estanteria">
            <button class="btn-producto">🍎 Manzana</button>
            <button class="btn-producto">🍕 Pizza</button>
            <button class="btn-producto">🍦 Helado</button>
            <button class="btn-producto">🥩 Chuletón</button>
            <button class="btn-producto">🥑 Aguacate</button>
            <button class="btn-producto">🍩 Donut</button>
        </div>

        <!-- Pantalla del carrito -->
        <div id="pantallaCarrito" class="salida">Tu carrito está vacío. ¡Compra algo!</div>

        <!-- Firma de autoría -->
        <div class="firma">Alpe Formación - Realizado por Ramón Abramo</div>
    </div>
    <script src="app.js"></script>
</body>

</html>
